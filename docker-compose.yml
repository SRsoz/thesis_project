services:
  postgres:
    image: postgres:16
    container_name: phoenix_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - phoenix_postgres_data:/var/lib/postgresql/data

  adminer:
    image: adminer
    container_name: phoenix_adminer
    restart: always
    ports:
      - "8080:8080"

volumes:
  phoenix_postgres_data: